name: Build test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Called by publish_pypi.yml. There is no cross-workflow `needs` in GitHub
  # Actions, so reusing the validate/build jobs for a release gate has to go
  # through workflow_call rather than a job reference. Renaming or removing
  # this trigger breaks the release workflow.
  workflow_call:
    inputs:
      gate_only:
        description: >-
          Run only Lint/Test/Scan and Build, skipping the TestPyPI deploy and
          its smoke test. Set by publish_pypi.yml, which publishes to real PyPI
          and must not touch TestPyPI on the release path.
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.10" # minimum supported version

jobs:
  validate:
    name: Lint, Test and Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # CodeQL SARIF upload
    steps:
      # ---------- 1. Environment ----------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --no-sources is defensive: a local-path torch wheel pin exists in some
        # working trees but is NOT committed on master. If it ever lands here, the
        # aarch64 path would break x86_64 runners; ignoring sources keeps torch
        # resolving from PyPI. No uv.lock is committed, so uv resolves fresh.
        run: uv sync --no-sources --group dev --group lint

      # ---------- 2. Lint ----------
      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # NLTK 3.9+ requires punkt_tab for nltk.sent_tokenize; the package
      # data is not installed by pip/uv with the NLTK Python dependency.
      - name: Download NLTK punkt_tab data
        run: uv run python -m nltk.downloader punkt_tab

      # ---------- 3. Tests ----------
      - name: Run tests
        run: uv run pytest tests -v

      # ---------- 4. CodeQL security scan ----------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ---------- 5. Build ----------
      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        # Consumed by publish_pypi.yml when this workflow runs as a reusable
        # call: artifacts are scoped to the whole run, so the release job
        # downloads this one by name. Do not rename it casually.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-test:
    name: Deploy to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # `!= true` rather than `!inputs.gate_only`: on a push trigger the inputs
    # context is empty, and comparing against true keeps that path running.
    # When this job is skipped, test-pypi skips too via its `needs`.
    if: ${{ inputs.gate_only != true }}
    permissions:
      contents: write # GitHub Release
      id-token: write # mandatory for OIDC trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # ---------- 6. Test PyPI ----------
      # Trusted publishing (OIDC): no password. Setting a password would force
      # token auth and silently bypass the trusted publisher configured on TestPyPI.
      # skip-existing is intentional here: PyPI/TestPyPI reject a filename that was
      # already uploaded, so re-running CI on an unchanged version must not fail.
      # Keep it OFF for the real PyPI job so genuine duplicates fail loudly.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-pypi:
    name: Test TestPyPI package
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Wait for TestPyPI propagation
        run: sleep 30

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Test PyPI package installation
        # Installs WITH dependencies: aap_core/__init__.py imports policy_trainer,
        # which imports torch/wandb at module level, so a --no-deps install cannot
        # be imported at all. Deps resolve from PyPI via --extra-index-url because
        # TestPyPI does not mirror them.
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          uv venv /tmp/smoke --python "$PYTHON_VERSION"
          uv pip install --python /tmp/smoke \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple \
            "aap-core==${VERSION}"
          # Assert the package exposes __version__ and it matches pyproject.toml.
          /tmp/smoke/bin/python -c "import aap_core; assert aap_core.__version__ == '${VERSION}', aap_core.__version__; print('aap_core', aap_core.__version__)"
